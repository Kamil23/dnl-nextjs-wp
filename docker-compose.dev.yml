# Local development database. Prod runs the same image on the Hetzner VPS.
services:
  db:
    image: postgres:16-alpine
    container_name: dnl-db
    environment:
      POSTGRES_USER: dnl
      POSTGRES_PASSWORD: dnl
      POSTGRES_DB: dietanaluzie
    ports:
      - "5433:5432"
    volumes:
      - dnl-pgdata:/var/lib/postgresql/data


  search:
    image: getmeili/meilisearch:latest
    container_name: dnl-search
    environment:
      MEILI_MASTER_KEY: dnl-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - dnl-meili:/meili_data

volumes:
  dnl-pgdata:
  dnl-meili:
